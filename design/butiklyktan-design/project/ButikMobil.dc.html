<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Butik Lyktan – kortspel mobil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF;color:#1C2233;font-family:'Figtree',system-ui,sans-serif}
a{color:#1C2233;text-decoration:none}a:hover{color:#8A5200}
</style>
</helmet>
<div style="width: 390px; height: 1800px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; font-family: 'Figtree', system-ui, sans-serif; color: #1C2233">

<div style="padding: 10px 16px; display: flex; align-items: center; justify-content: center; gap: 8px; background: #1F2A44; color: #FFFFFF; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase">
<span style="width: 7px; height: 7px; border-radius: 4px; background: {{accent}}"></span>Endast hämtning i butik
</div>

<header style="height: 68px; box-sizing: border-box; padding: 0 8px; display: grid; grid-template-columns: 96px minmax(0, 1fr) 96px; align-items: center; border-bottom: 1px solid #ECE8E0">
<div style="display: flex">
<a href="MobilMeny.dc.html" aria-label="Meny" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1C2233"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h16"></path></svg></a>
<button aria-label="Sök" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: #1C2233"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></button>
</div>
<a href="Mobil.dc.html" style="justify-self: center; display: flex; align-items: center; gap: 8px">
<span style="width: 34px; height: 34px; border-radius: 17px; background: {{accent}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F2A44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2.5h6"></path><path d="M12 2.5v2.5"></path><path d="M6.5 8l1.5-3h8l1.5 3"></path><path d="M7 8h10l-1 12H8L7 8z"></path><path d="M12 11.5v4"></path></svg></span>
<span style="font-size: 20px; font-weight: 800; letter-spacing: -0.02em">Butik Lyktan</span>
</a>
<div style="justify-self: end; display: flex">
<button aria-label="Konto" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: #1C2233"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg></button>
<button aria-label="Varukorg" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: #1C2233"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 12H6L5 8z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg></button>
</div>
</header>

<section style="padding: 16px 16px 0">
<div style="padding: 22px 0 20px; border-radius: 20px; background: #FFF6E5; display: flex; flex-direction: column; align-items: center; gap: 10px">
<div style="font-size: 13px; color: #6A6F7A"><a href="Mobil.dc.html" style="color: #6A6F7A">Start</a> / Kortspel</div>
<h1 style="margin: 0; font-size: 34px; font-weight: 800; text-transform: uppercase">Kortspel</h1>
<div style="align-self: stretch; display: flex; gap: 8px; padding: 4px 16px 0; overflow: hidden">
<sc-for list="{{subs}}" as="s" hint-placeholder-count="4">
<button onClick="{{s.pick}}" style="{{s.style}}; flex-shrink: 0">{{s.label}}</button>
</sc-for>
</div>
</div>
</section>

<section style="padding: 16px 16px 0; display: flex; gap: 10px">
<button type="button" style="flex-grow: 1; height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 24px; border: 2px solid #1F2A44; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 800; color: #1C2233"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16"></path><path d="M7 12h10"></path><path d="M10 18h4"></path></svg>Filter<span style="min-width: 20px; height: 20px; border-radius: 10px; background: {{accent}}; font-size: 12px; display: flex; align-items: center; justify-content: center">1</span></button>
<label style="flex-grow: 1; display: flex"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Sortera</span>
<select style="width: 100%; height: 48px; padding: 0 14px; border-radius: 24px; border: 2px solid #ECE8E0; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700; color: #1C2233"><option>Nyast först</option><option>Pris, lägst först</option><option>Pris, högst först</option></select>
</label>
</section>
<div style="padding: 12px 20px 0; font-size: 13px; color: #6A6F7A">[Antal] produkter · I lager i butiken</div>

<section style="padding: 14px 16px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 12px; row-gap: 24px">
<sc-for list="{{products}}" as="p" hint-placeholder-count="8">
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center">
<div style="align-self: stretch; height: 200px; border-radius: 14px; background: #F5F3EF; position: relative; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #6A6F7A">Produktbild
<button aria-label="Lägg i varukorg" style="position: absolute; right: 8px; bottom: 8px; width: 44px; height: 44px; border: 0; border-radius: 22px; background: {{accent}}; color: #1F2A44; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></button>
</div>
<span style="font-size: 11px; font-weight: 600; color: #6A6F7A">{{p.brand}}</span>
<a href="ButikMobil.dc.html" style="font-size: 14px; font-weight: 700; line-height: 1.3">{{p.name}}</a>
<span style="font-size: 15px; font-weight: 800">{{p.price}}</span>
</div>
</sc-for>
</section>

<section style="padding: 28px 16px 40px; display: flex; justify-content: center">
<button type="button" style="height: 48px; padding: 0 28px; border: 0; border-radius: 24px; background: #1F2A44; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700">Visa fler</button>
</section>

<footer style="flex-grow: 1; background: #1F2A44; color: #C9CFDD; padding: 36px 20px; display: flex; flex-direction: column; gap: 18px; font-size: 14px">
<span style="font-size: 24px; font-weight: 800; color: #FFFFFF">Butik Lyktan</span>
<div style="display: flex; gap: 24px"><a href="https://instagram.com" style="color: #C9CFDD">Instagram</a><a href="https://discord.com" style="color: #C9CFDD">Discord</a></div>
<span style="color: #9AA3B8; font-size: 12px">© 2026 Butik Lyktan</span>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2A93B","options":["#F2A93B","#F7D154","#7BC8B4","#F28C6B"]},"$preview":{"width":390,"height":1800}}'>
class Component extends DCLogic {
renderVals() {
const shopOpen = (this.state && this.state.shop != null) ? this.state.shop : false;
const picked = (this.state && this.state.sub) || 'Alla';
const labels = ['Alla', 'Magic: The Gathering', '[Spel 2]', '[Spel 3]'];
const base = 'height: 44px; padding: 0 20px; border-radius: 22px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; ';
const ph = { brand: '[Märke]', name: '[Produktnamn]', price: '[Pris]' };
return {
shopOpen,
toggleShop: () => this.setState({ shop: !shopOpen }),
openShop: () => this.setState({ shop: true }),
closeShop: () => this.setState({ shop: false }),
chevStyle: 'transition: transform 0.15s; transform: rotate(' + (shopOpen ? 180 : 0) + 'deg)',
accent: this.props.accent ?? '#F2A93B',
subs: labels.map((l) => ({
label: l,
style: base + (l === picked ? 'background: #1F2A44; color: #FFFFFF; border: 2px solid #1F2A44' : 'background: #FFFFFF; color: #1C2233; border: 2px solid #ECE8E0'),
pick: () => this.setState({ sub: l })
})),
products: [
{ brand: 'Wizards of the Coast', name: 'MTG Commander-lek – [namn]', price: '829 kr' },
{ brand: 'Wizards of the Coast', name: 'MTG Commander-lek – [namn]', price: '829 kr' },
ph, ph, ph, ph, ph, ph
]
};
}
}
</script>
</body>
</html>
